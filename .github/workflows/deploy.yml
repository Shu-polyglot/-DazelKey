name: Deploy react-app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one
# rather than letting them race.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Build
        working-directory: react-app
        env:
          # All values here are designed to be publicly available in a
          # browser (the Google client ID is a public OAuth client-side
          # token flow, no client secret involved -- see .env.example).
          # Do not put a service_role or secret key in this workflow.
          VITE_SUPABASE_URL: https://yrovrilfgaaewaashipy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cMTCTCrW-4VFuF1EyRZfuw_0xE53Clc
          VITE_GOOGLE_CALENDAR_CLIENT_ID: 193453650584-se38eos764gj5tn2dve1bo1t86v2nsle.apps.googleusercontent.com
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
